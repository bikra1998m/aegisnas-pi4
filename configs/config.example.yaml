ailite:
  enabled: true
  mode: "lite" # lite for local rule-based advice, full for an OpenAI-compatible AI provider.
  provider: "local" # local or openai-compatible.
  endpoint: "" # Example: https://api.example.ai or http://127.0.0.1:11434.
  model: "" # Required when endpoint is set.
  api_key_env: "AEGIS_AI_API_KEY"
  request_timeout_seconds: 20
  max_input_events: 200
  recommendation_limit: 100
  remote_webhook: ""

onboarding:
  device_inventory_enabled: false
  portal_enabled: false
  certificate_enrollment_enabled: false
  eap_tls_enabled: false
  ca_mode: "none" # none, internal, or external.
  ca_cert_path: "" # Required with ca_mode=internal and certificate enrollment.
  ca_key_path: "" # Required with ca_mode=internal and certificate enrollment.
  ca_enrollment_url: "" # Required with ca_mode=external and certificate enrollment.
  ca_enrollment_token_env: "AEGIS_CA_ENROLLMENT_TOKEN" # Optional bearer token env for external CA APIs.

profiling:
  mac_inventory_enabled: false
  passive_enabled: false # Uses DHCP lease observations for hostname, client-id, OUI, and profile risk signals.
  poll_interval_seconds: 300
  retention_hours: 24
  posture_enabled: false
  mdm_sync_enabled: false
  mdm_provider: "" # generic, workspace-one, intune, or jamf.
  mdm_endpoint: ""
  mdm_api_token_env: "AEGIS_MDM_API_TOKEN" # Optional bearer token env for MDM or UEM APIs.
  mdm_cache_hours: 12
  compliance_webhook: ""
  compliance_token_env: "AEGIS_COMPLIANCE_WEBHOOK_TOKEN" # Optional bearer token env for compliance webhooks.
  remediation_enabled: false # Allows posture and high-risk profile signals to quarantine active sessions.

integrations:
  admin_sso:
    enabled: false
    provider: "" # oidc or saml.
    issuer_url: ""
    client_id: ""
    client_secret_env: ""
    redirect_url: ""
    groups_claim: ""
  siem:
    enabled: false
    provider: "" # webhook, splunk-hec, or elastic.
    endpoint: ""
    api_key_env: "AEGIS_SIEM_API_KEY"
    batch_size: 100
  controller:
    enabled: false
    platform: "" # generic, cisco, aruba, juniper-mist, ruckus, fortinet, mikrotik, unifi, meraki, or openwifi.
    endpoint: ""
    api_token_env: "AEGIS_CONTROLLER_API_TOKEN"
    api_username_env: "" # Cisco ISE, Ruckus SmartZone, or MikroTik RouterOS username environment variable.
    api_password_env: "" # Cisco ISE, Ruckus SmartZone, or MikroTik RouterOS password environment variable.
    radius_profile: "" # Existing Aruba/FortiGate/UniFi RADIUS profile or Ruckus SmartZone authentication service name.
    radius_server: "" # RADIUS hostname or IP used by managed Mist or MikroTik enterprise WLANs.
    radius_secret_env: "" # Environment variable containing the Mist or MikroTik RADIUS shared secret.
    sync_mode: "monitor" # monitor and pull-config are read-only; push-config mutates controller policy; coa-only limits automation to session changes.
    site: "" # Required for vendor-native adapters. Use the controller site, zone, or network identifier.

governance:
  delegated_admin_enabled: false
  rbac_mode: "local" # local, external-groups, or hybrid.
  external_groups_enabled: false
  multi_tenant_enabled: false
  tenant_claim: ""

high_availability:
  enabled: false
  role: "standby" # active or standby.
  peer_api_url: ""
  virtual_ip: ""
  heartbeat_interval_seconds: 5
  failover_timeout_seconds: 20
  replication_interval_seconds: 300
  replication_stale_after_seconds: 900
  split_brain_protection_enabled: true
  auto_stage_shared_package: false
  auto_activate_on_failover: false
  replication_signing_key_env: "" # Optional shared HMAC key env for signing HA replication bundles.
  replication_encryption_key_env: "" # Optional shared env for encrypting HA replication bundles at rest and in transit.
  witness_api_url: "" # Optional external witness that must allow standby promotion before VIP takeover.
  witness_urls: [] # Optional multi-witness list. When populated, this overrides witness_api_url.
  witness_quorum: 1 # Minimum number of witnesses that must allow promotion.
  witness_weights: {} # Optional per-witness weight overrides keyed by witness URL. Default weight is 1.
  witness_weight_threshold: 0 # Optional minimum combined witness weight required for promotion. 0 disables weight enforcement.
  witness_groups: {} # Optional per-witness group overrides keyed by witness URL. Unlisted witnesses count as their own group.
  witness_min_distinct_groups: 0 # Optional minimum number of distinct witness groups that must approve promotion. 0 disables diversity enforcement.
  witness_required_groups: [] # Optional witness groups that must all appear in witness approvals before promotion is allowed.
  witness_sources: {} # Optional per-witness source overrides keyed by witness URL. Unlisted witnesses count as their own source.
  witness_source_confidence: {} # Optional source-to-confidence-tier mapping. Unlisted sources use the standard confidence tier.
  witness_required_sources: [] # Optional source classes that must all appear in witness approvals before promotion is allowed.
  witness_required_urls: [] # Optional witness endpoints that must all appear in witness approvals before promotion is allowed.
  witness_required_sources_by_tier: {} # Optional per-tier source classes. Each listed tier must include approvals from the named sources.
  witness_required_urls_by_tier: {} # Optional per-tier witness endpoints. Each listed tier must include approvals from the named witness URLs.
  witness_required_groups_by_tier: {} # Optional per-tier witness groups. Each listed tier must include approvals from the named groups.
  witness_policy_mode: "all" # all, any, group_only, source_only, or url_only for combining group, source, and URL rules.
  witness_policy_mode_by_tier: {} # Optional per-tier overrides for combining tier-specific source, group, and URL rules. Values: all, any, group_only, source_only, url_only.
  witness_failure_tolerance: 0 # Optional number of failed witness probes that may reduce the required quorum during promotion.
  witness_failure_weight_tolerance: 0 # Optional amount of failed witness weight that may reduce the effective weight threshold.
  witness_min_approvals_by_tier: {} # Optional per-tier approval floors. Promotion must include at least this many approvals from each listed confidence tier.
  witness_min_weight_by_tier: {} # Optional per-tier weight floors. Promotion must include at least this much witness weight from each listed confidence tier.
  witness_min_distinct_groups_by_tier: {} # Optional per-tier group diversity floors. Promotion must include this many distinct witness groups in each listed confidence tier.
  witness_min_distinct_sources_by_tier: {} # Optional per-tier source diversity floors. Promotion must include this many distinct witness sources in each listed confidence tier.
  witness_max_age_by_tier: {} # Optional per-tier freshness overrides in seconds. Tiers without overrides fall back to witness_max_age_seconds.
  witness_required_node_by_tier: {} # Optional per-tier witness identities. Tiers without overrides fall back to witness_required_node.
  witness_signature_required_tiers: [] # Optional confidence tiers that must return signed witness responses even when signature enforcement is not global.
  witness_replay_required_tiers: [] # Optional confidence tiers that must satisfy replay challenge verification even when global witness_replay_protection_enabled is off.
  witness_failure_tolerance_by_tier: {} # Optional per-tier failed witness count budgets. Tiers without overrides fall back to witness_failure_tolerance.
  witness_failure_weight_tolerance_by_tier: {} # Optional per-tier failed witness weight budgets. Tiers without overrides fall back to witness_failure_weight_tolerance.
  witness_blocking_tiers: [] # Optional confidence tiers whose explicit witness denies block promotion immediately.
  witness_token_env: "" # Optional bearer token env used when calling the external HA witness.
  witness_signing_key_env: "" # Optional shared HMAC key env used to verify external witness responses.
  witness_max_age_seconds: 0 # Optional maximum witness observed_at age; 0 disables freshness enforcement.
  witness_required_node: "" # Optional witness node identity that must match witness_node in the response.
  witness_replay_protection_enabled: false # Require the signed witness response to echo a per-request challenge.
  preempt: false
  preempt_holdoff_seconds: 0 # Optional active-node wait before reclaiming the VIP after peer recovery when preempt is enabled.
  shared_state_dir: "/var/lib/aegisnas/ha"

dhcp:
  enabled: true
  lease_time: 12h
  authoritative: true
  static_leases:
    - mac: "aa:bb:cc:dd:ee:ff"
      ip: "192.168.50.10"
      hostname: "printer-lobby"
      enabled: false
      description: "Example reservation"

wireless:
  enabled: false
  country_code: US
  interface: wlan0
  driver: nl80211
  hw_mode: g
  channel: 6
  beacon_interval: 100
  wmm_enabled: true
  ht_enabled: true
  ctrl_interface: /var/run/hostapd
  hostapd_config_path: /etc/hostapd/hostapd.conf
  ssids:
    - name: "Aegis Guest"
      auth_mode: "captive-portal"
      bridge: "br-guest"
      client_isolation: true
      portal_profile: "default-guest"
      bandwidth_profile: "guest-basic"
    - name: "Aegis Corp"
      auth_mode: "wpa2-enterprise"
      bridge: "br-corp"
      dynamic_vlan: true
      identity_source: "radius-upstream"
      bandwidth_profile: "corp-standard"
    - name: "Aegis Staff"
      auth_mode: "wpa3-enterprise"
      bridge: "br-staff"
      identity_source: "radius-upstream"
      bandwidth_profile: "corp-standard"
