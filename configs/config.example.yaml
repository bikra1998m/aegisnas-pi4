mode: two-nic

deployment:
  profile: branch
  form: physical
  hardware:
    memory_mb: 4096
    cpu_cores: 2
    prefer_external_ap: false
    wireless_passthrough: false

wan:
  name: eth0
  dhcp: true

lan:
  name: eth1
  dhcp: false
  address: 192.168.50.1/24
  gateway: 192.168.50.1
  dhcp_range: "192.168.50.100,192.168.50.200,12h"

network:
  interfaces:
    - name: eth2.50
      address: 10.50.0.1/24
      mtu: 1500
      enabled: false
      description: "Optional transit or services VLAN"
  gateways:
    - name: primary-upstream
      address: 192.168.10.1
      interface: eth0
      metric: 0
      default: true
      enabled: false
      description: "Optional default route override"
  dns:
    upstream_servers:
      - 8.8.8.8
      - 8.8.4.4
    search_domains: []
    local_domain: aegis.local
  static_routes:
    - name: branch-link
      destination: 172.16.20.0/24
      gateway: 192.168.10.254
      interface: eth0
      metric: 10
      enabled: false
      description: "Optional route to a downstream branch"
  firewall:
    rules:
      - name: allow-support-web
        chain: forward
        action: accept
        interface: eth1
        source: 192.168.50.0/24
        destination: 203.0.113.0/24
        protocol: tcp
        ports: "443"
        enabled: false
        description: "Example custom exception rule"
    free_sites:
      - type: domain
        value: neverssl.com
        enabled: true
        description: "Useful captive portal test destination"
      - type: cidr
        value: 203.0.113.0/24
        enabled: false
        description: "Example wall-garden network"
    dos_protection:
      enabled: false
      syn_rate: "50/second"
      icmp_rate: "25/second"
      conn_rate: "200/second"
      burst: 100
      log_drops: true

vlans:
  - id: 20
    name: guest
    subnet: 10.20.0.0/24
    gateway: 10.20.0.1
    dhcp_start: "10.20.0.100"
    dhcp_end: "10.20.0.200"
    purpose: guest
  - id: 30
    name: corp
    subnet: 10.30.0.0/24
    gateway: 10.30.0.1
    dhcp_start: "10.30.0.100"
    dhcp_end: "10.30.0.200"
    purpose: corp
  - id: 40
    name: mgmt
    subnet: 10.40.0.0/24
    gateway: 10.40.0.1
    dhcp_start: "10.40.0.100"
    dhcp_end: "10.40.0.200"
    purpose: management

database:
  path: /var/lib/aegisnas/data.db

logging:
  level: info
  output: stdout

health:
  port: 8080

admin_port: 8083

radius:
  secret: "replace-this-radius-secret"
  auth_port: 1812
  acct_port: 1813
  max_sessions: 1024
  cert_dir: /etc/freeradius/3.0/certs
  nas_identifier: "aegisnas-edge-01"
  request_timeout_seconds: 5
  interim_update_seconds: 300
  eap:
    default_type: peap
    peap_inner: mschapv2
    ttls_inner: mschapv2
    tls_min_version: "1.2"
    tls_max_version: "1.3"
  dynamic_auth:
    enabled: true
    port: 3799
  vendor:
    enabled: false
    name: "AegisNAS"
    id: 55555 # Lab placeholder from configs/aegisnas-vendor.dictionery. Replace with your IANA Private Enterprise Number before production use.
    attributes: [] # Optional local overrides or extensions. Built-ins come from configs/aegisnas-vendor.dictionery.
  clients:
    - ip: 127.0.0.1
      secret: "replace-this-radius-secret"
      shortname: "localhost"
  upstream:
    enabled: false
    realm: "aegis-upstream"
    pool_strategy: "fail-over"
    status_check: "status-server"
    response_window: 20
    zombie_period: 40
    revive_interval: 120
    check_interval: 30
    num_answers_to_alive: 3
    strip_realm: false
    servers:
      - name: "primary-aaa"
        address: "10.10.10.10"
        auth_port: 1812
        acct_port: 1813
        secret: "replace-this-upstream-secret"
      - name: "secondary-aaa"
        address: "10.10.10.11"
        auth_port: 1812
        acct_port: 1813
        secret: "replace-this-upstream-secret-too"

portal:
  enabled: true
  port: 8081
  listen_ip: "192.168.50.1"
  branding: "AegisNAS Guest WiFi"
  success_url: "https://example.com/success"
  logout_url: "https://example.com/logout"
  radius_auth: true
  local_fallback: true
  guest_workflows:
    self_registration_enabled: false
    sponsor_approval_enabled: false
    invite_delivery: "none"
    approval_delivery: ""
    email_from: ""
    smtp_server: ""
    smtp_port: 587
    sms_provider: ""
    sms_endpoint: ""

ldap:
  enabled: false
  url: "ldaps://ldap.example.com"
  base_dn: "dc=example,dc=com"
  bind_dn: "cn=svc-aegisnas,dc=example,dc=com"
  bind_password: "replace-this-password"
  user_filter: "(uid=%s)"
  group_filter: "(memberUid=%s)"

policy:
  default_role: guest-basic
  runtime_shaping_enabled: true

telemetry:
  enabled: true
  prometheus_port: 9090

ailite:
  enabled: true
  mode: "lite" # lite for local rule-based advice, full for an OpenAI-compatible AI provider.
  provider: "local" # local or openai-compatible.
  endpoint: "" # Example: https://api.example.ai or http://127.0.0.1:11434.
  model: "" # Required when endpoint is set.
  api_key_env: "AEGIS_AI_API_KEY"
  request_timeout_seconds: 20
  max_input_events: 200
  recommendation_limit: 100
  remote_webhook: ""

onboarding:
  device_inventory_enabled: false
  portal_enabled: false
  certificate_enrollment_enabled: false
  eap_tls_enabled: false
  ca_mode: "none" # none, internal, or external.
  ca_cert_path: "" # Required with ca_mode=internal and certificate enrollment.
  ca_key_path: "" # Required with ca_mode=internal and certificate enrollment.
  ca_enrollment_url: "" # Required with ca_mode=external and certificate enrollment.
  ca_enrollment_token_env: "AEGIS_CA_ENROLLMENT_TOKEN" # Optional bearer token env for external CA APIs.

profiling:
  mac_inventory_enabled: false
  passive_enabled: false
  poll_interval_seconds: 300
  retention_hours: 24
  posture_enabled: false
  mdm_sync_enabled: false
  mdm_provider: ""
  mdm_endpoint: ""
  mdm_api_token_env: "AEGIS_MDM_API_TOKEN" # Optional bearer token env for MDM or UEM APIs.
  mdm_cache_hours: 12
  compliance_webhook: ""
  compliance_token_env: "AEGIS_COMPLIANCE_WEBHOOK_TOKEN" # Optional bearer token env for compliance webhooks.
  remediation_enabled: false

integrations:
  admin_sso:
    enabled: false
    provider: "" # oidc or saml.
    issuer_url: ""
    client_id: ""
    client_secret_env: ""
    redirect_url: ""
    groups_claim: ""
  siem:
    enabled: false
    provider: "" # webhook, splunk-hec, or elastic.
    endpoint: ""
    api_key_env: "AEGIS_SIEM_API_KEY"
    batch_size: 100
  controller:
    enabled: false
    platform: "" # generic, cisco, aruba, juniper-mist, ruckus, fortinet, or mikrotik.
    endpoint: ""
    api_token_env: "AEGIS_CONTROLLER_API_TOKEN"
    sync_mode: "monitor" # monitor, push-config, or coa-only.
    site: ""

governance:
  delegated_admin_enabled: false
  rbac_mode: "local" # local, external-groups, or hybrid.
  external_groups_enabled: false
  multi_tenant_enabled: false
  tenant_claim: ""

dhcp:
  enabled: true
  lease_time: 12h
  authoritative: true
  static_leases:
    - mac: "aa:bb:cc:dd:ee:ff"
      ip: "192.168.50.10"
      hostname: "printer-lobby"
      enabled: false
      description: "Example reservation"

wireless:
  enabled: false
  country_code: US
  interface: wlan0
  driver: nl80211
  hw_mode: g
  channel: 6
  beacon_interval: 100
  wmm_enabled: true
  ht_enabled: true
  ctrl_interface: /var/run/hostapd
  hostapd_config_path: /etc/hostapd/hostapd.conf
  ssids:
    - name: "Aegis Guest"
      auth_mode: "captive-portal"
      bridge: "br-guest"
      client_isolation: true
      portal_profile: "default-guest"
      bandwidth_profile: "guest-basic"
    - name: "Aegis Corp"
      auth_mode: "wpa2-enterprise"
      bridge: "br-corp"
      dynamic_vlan: true
      identity_source: "radius-upstream"
      bandwidth_profile: "corp-standard"
    - name: "Aegis Staff"
      auth_mode: "wpa3-enterprise"
      bridge: "br-staff"
      identity_source: "radius-upstream"
      bandwidth_profile: "corp-standard"
