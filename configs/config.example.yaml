mode: two-nic

deployment:
  profile: branch
  form: physical
  hardware:
    memory_mb: 4096
    cpu_cores: 2
    storage_gb: 32
    prefer_external_ap: false
    wireless_passthrough: false

wan:
  name: eth0
  dhcp: true

lan:
  name: eth1
  dhcp: false
  address: 192.168.50.1/24
  gateway: 192.168.50.1
  dhcp_range: "192.168.50.100,192.168.50.200,12h"

network:
  interfaces:
    - name: eth2.50
      address: 10.50.0.1/24
      mtu: 1500
      enabled: false
      description: "Optional transit or services VLAN"
  gateways:
    - name: primary-upstream
      address: 192.168.10.1
      interface: eth0
      metric: 0
      default: true
      enabled: false
      description: "Optional default route override"
  dns:
    upstream_servers:
      - 8.8.8.8
      - 8.8.4.4
    search_domains: []
    local_domain: aegis.local
  static_routes:
    - name: branch-link
      destination: 172.16.20.0/24
      gateway: 192.168.10.254
      interface: eth0
      metric: 10
      enabled: false
      description: "Optional route to a downstream branch"
  firewall:
    rules:
      - name: allow-support-web
        chain: forward
        action: accept
        interface: eth1
        source: 192.168.50.0/24
        destination: 203.0.113.0/24
        protocol: tcp
        ports: "443"
        enabled: false
        description: "Example custom exception rule"
    free_sites:
      - type: domain
        value: neverssl.com
        enabled: true
        description: "Useful captive portal test destination"
      - type: cidr
        value: 203.0.113.0/24
        enabled: false
        description: "Example wall-garden network"
    dos_protection:
      enabled: false
      syn_rate: "50/second"
      icmp_rate: "25/second"
      conn_rate: "200/second"
      burst: 100
      log_drops: true

vlans:
  - id: 20
    name: guest
    subnet: 10.20.0.0/24
    gateway: 10.20.0.1
    dhcp_start: "10.20.0.100"
    dhcp_end: "10.20.0.200"
    purpose: guest
  - id: 30
    name: corp
    subnet: 10.30.0.0/24
    gateway: 10.30.0.1
    dhcp_start: "10.30.0.100"
    dhcp_end: "10.30.0.200"
    purpose: corp
  - id: 40
    name: mgmt
    subnet: 10.40.0.0/24
    gateway: 10.40.0.1
    dhcp_start: "10.40.0.100"
    dhcp_end: "10.40.0.200"
    purpose: management

database:
  backend: sqlite # sqlite for lite/lab, postgres for enterprise production
  path: /var/lib/aegisnas/data.db
  # PostgreSQL production data plane example:
  # backend: postgres
  # dsn_ref: "env:AEGIS_SECRET_POSTGRES_DSN"
  # sslmode: verify-full
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_seconds: 1800
  conn_max_idle_time_seconds: 300
  connect_timeout_seconds: 10
  statement_timeout_milliseconds: 30000
  migration_lock_timeout_seconds: 30
  production_require_postgresql: false
  production_require_tls: true
  allow_unsafe_postgresql_sslmode: false
  allow_inline_postgresql_dsn: false

logging:
  level: info
  output: stdout

health:
  port: 8080

admin_port: 8083

security:
  secrets:
    enabled: true
    providers: ["env", "file"]
    file_base_dir: /etc/aegisnas/secrets
    max_secret_bytes: 8192
    allow_inline: true # Backward-compatible upgrade mode. Set false after all secret_ref fields resolve.
    production_require_references: true # Production readiness blocks inline secret material.

radius:
  secret: ""
  secret_ref: "env:AEGIS_SECRET_RADIUS_SHARED"
  auth_port: 1812
  acct_port: 1813
  max_sessions: 1024
  cert_dir: /etc/freeradius/3.0/certs
  nas_identifier: "aegisnas-edge-01"
  request_timeout_seconds: 5
  interim_update_seconds: 300
  eap:
    default_type: peap
    peap_inner: mschapv2
    ttls_inner: mschapv2
    tls_min_version: "1.2"
    tls_max_version: "1.3"
    check_crl: false # Enable for EAP-TLS after placing CA certificates and CRLs in cert_dir and running c_rehash.
    check_all_crl: false # Check intermediate CA revocation too; requires check_crl.
    ca_path_reload_interval: 3600 # Reload hashed CA/CRL files so renewed CRLs take effect.
    ocsp:
      enabled: false
      override_cert_url: false # Use the certificate AIA responder unless an explicit URL is required.
      url: ""
      use_nonce: true
      timeout_seconds: 5
      soft_fail: false # Keep false for strict production revocation enforcement.
  dynamic_auth:
    enabled: true
    port: 3799
  dynamic_clients:
    enabled: false
    discovery_enabled: false
    approval_required: true
    enrollment_token_ref: "env:AEGIS_NAS_ENROLLMENT_TOKEN"
    enrollment_ttl_seconds: 86400
    max_pending: 256
    discovery_allowed_cidrs: []
    default_nas_type: other
    default_transport: udp
    default_template: default
  packet_hardening:
    enabled: true
    fail_closed: true
    require_known_source: true
    allow_trailing_padding: false
    allow_status_server: true
    allow_status_client: false
    require_message_authenticator: auto # auto requires it for EAP, Status-Server, CoA, and Disconnect; use always for strict labs.
    max_packet_bytes: 4096
    max_attributes_per_packet: 128
    max_proxy_state_attributes: 8
    max_proxy_state_bytes: 1024
    replay_cache_enabled: true
    replay_window_seconds: 30
    replay_cache_max_entries: 16384
    rate_limit_enabled: true
    per_client_rate_limit_per_second: 250
    per_client_burst: 500
    trusted_proxy_cidrs: [] # Add trusted HA peers, loopback relays, or proxy subnets that are not listed as RADIUS clients.
    event_retention_limit: 6000
  radsec:
    enabled: false
    listen_address: "0.0.0.0"
    port: 2083
    certificate_file: /etc/aegisnas/radsec/server.crt
    private_key_file: /etc/aegisnas/radsec/server.key
    private_key_password_env: "" # Set an environment variable name, never a password value.
    ca_file: /etc/aegisnas/radsec/ca.crt
    ca_path: /etc/aegisnas/radsec/trust
    check_crl: true
    check_all_crl: true
    ca_path_reload_interval: 3600
    tls_min_version: "1.2"
    tls_max_version: "1.3"
    cipher_list: "DEFAULT@SECLEVEL=2"
    radius_v11: forbid # Use allow/require only with a RADIUS/1.1-enabled FreeRADIUS build and TLS 1.3.
    max_connections: 64
    lifetime_seconds: 86400
    idle_timeout_seconds: 300
    probe_interval_seconds: 30
    certificate_expiry_warning_days: 30
  vendor:
    enabled: false
    name: "AegisNAS"
    id: 55555 # Lab placeholder. Production changes are written by the verified vendor-identity migration workflow after IANA assignment.
    dictionary_release: "freeradius-3.2.8" # Pinned release profile for VSA aliases, firmware scopes, and registry provenance.
    identity_mode: "lab" # lab, unverified (disabled only), or production. Use the verified migration API to enter production mode.
    assigned_organization: "" # Exact organization in IANA's Private Enterprise Numbers registry.
    assignment_registry_url: ""
    registry_last_updated: ""
    assignment_verified_at: ""
    assignment_registry_sha256: ""
    assignment_record_sha256: ""
    legacy_ids: [] # Inbound-only PENs accepted during a migration window; replies always use id.
    legacy_accept_until: "" # Required RFC3339 deadline when legacy_ids is non-empty.
    compatibility_packs: ["standard", "mikrotik", "wispr"] # Add aegisnas, aruba, ruckus, fortinet, cisco, ubnt, cambium, extreme, juniper, huawei, h3c, paloalto, tplink, meraki, or mist only after the NAS/controller side is prepared.
    dictionary_paths: [] # Optional FreeRADIUS dictionary files or directories to import for compatibility coverage, such as /etc/freeradius/3.0/dictionary or /usr/share/freeradius.
    opaque_pass_through:
      enabled: true
      max_attributes_per_packet: 32
      max_attribute_bytes: 249
      max_total_bytes_per_packet: 2048
      rules:
        # Unknown attributes are dropped unless explicitly allowed. Use
        # vendor_attribute for one VSA, vendor for all unknown VSAs from one
        # PEN, or standard for a non-sensitive standard RADIUS type.
        - direction: proxy_response
          kind: vendor_attribute
          vendor_id: 424242
          type: 77
          description: "Example lab controller correlation token"
    role_mappings: [] # Map local roles to certified uint32 values for cambium, aerohive, dlink, sonicwall, or zte; for example [{pack: dlink, role: admin, value: 5}].
    extended_vlan_mappings: [] # Extreme VSA 211 mappings; for example [{pack: extreme, role: voice, untagged_vlan: 20, tagged_vlans: [30, 40]}].
    avpair_mappings: [] # Certified per-role templates for juniper, huawei, h3c, or arista; for example [{pack: arista, role: admin, values: ["shell:roles=${role}"]}].
    portal_status_mappings: [] # Reversible TP-Link profile values; for example [{pack: tplink, portal_profile: "https://portal.example.test/guest", value: 1}].
    session_action_mappings: [] # Reversible Nomadix role/action values; for example [{pack: nomadix, role: expired-guest, action: disconnect, value: 1}].
    quota_mappings: [] # ChilliSpot combined data limits by role; for example [{pack: chillispot, role: guest-1g, max_total_octets: 1073741824}].
    service_name_mappings: [] # Nokia BCD service names by role; for example [{pack: nokia, role: mobile-data, service_name: "00123"}].
    attributes: [] # Optional FreeRADIUS-style local overrides or extensions. Built-ins come from configs/dictionary.aegisnas.
  clients:
    - ip: 127.0.0.1
      secret: ""
      secret_ref: "env:AEGIS_SECRET_RADIUS_SHARED"
      shortname: "localhost"
      nas_type: "other"
      transport: udp
    # RadSec clients use the fixed RFC 6614 application secret and exact certificate CN verification.
    # - ip: 10.20.0.20
    #   shortname: branch-nas-01
    #   nas_type: other
    #   transport: radsec
    #   radsec_certificate_cn: branch-nas-01.example.net
    #   radsec_certificate_issuer: ""
    #   radsec_radius_v11: forbid
  upstream:
    enabled: false
    realm: "aegis-upstream"
    pool_strategy: "fail-over"
    status_check: "status-server"
    response_window: 20
    zombie_period: 40
    revive_interval: 120
    check_interval: 30
    num_answers_to_alive: 3
    strip_realm: false
    accounting_spool:
      enabled: true
      max_queue_records: 10000
      max_attempts: 10
      initial_retry_seconds: 30
      max_retry_seconds: 3600
      record_ttl_seconds: 604800
      replay_interval_seconds: 60
      batch_size: 100
      lock_seconds: 120
      sent_retention_seconds: 604800
      poison_retention_seconds: 2592000
    servers:
      - name: "primary-aaa"
        address: "10.10.10.10"
        transport: udp
        auth_port: 1812
        acct_port: 1813
        secret: ""
        secret_ref: "env:AEGIS_SECRET_UPSTREAM_PRIMARY"
      # - name: "radsec-aaa"
      #   address: "radsec.example.net"
      #   transport: radsec
      #   radsec:
      #     port: 2083
      #     server_name: "radsec.example.net"
      #     psk:
      #       enabled: false
      #       identity: ""
      #       secret_ref: "env:AEGIS_RADSEC_PSK_CURRENT"
      #       next_identity: ""
      #       next_secret_ref: "env:AEGIS_RADSEC_PSK_NEXT"
      #       next_not_before: ""
      #       next_not_after: ""
      #       overlap_seconds: 86400
      #       warning_days: 30
      #     certificate_file: /etc/aegisnas/radsec/client.crt
      #     private_key_file: /etc/aegisnas/radsec/client.key
      #     private_key_password_env: ""
      #     ca_file: /etc/aegisnas/radsec/ca.crt
      #     ca_path: /etc/aegisnas/radsec/trust
      #     check_crl: true
      #     tls_min_version: "1.2"
      #     tls_max_version: "1.3"
      #     cipher_list: "DEFAULT@SECLEVEL=2"
      #     radius_v11: forbid
      #     max_connections: 16
      #     max_requests: 0
      #     lifetime_seconds: 86400
      #     idle_timeout_seconds: 300
      - name: "secondary-aaa"
        address: "10.10.10.11"
        transport: udp
        auth_port: 1812
        acct_port: 1813
        secret: ""
        secret_ref: "env:AEGIS_SECRET_UPSTREAM_SECONDARY"
    routes:
      - name: "corp"
        description: "Corporate users and managed devices"
        enabled: true
        realm: "corp.example.com"
        match_realms:
          - "employees.example.com"
        default: true
        strip_realm: false
        pool_strategy: "fail-over"
        status_check: "status-server"
        servers:
          - "primary-aaa"
          - "secondary-aaa"
      - name: "guest"
        description: "Guest and contractor access"
        enabled: true
        realm: "guest.example.com"
        match_realms: []
        default: false
        strip_realm: false
        pool_strategy: "load-balance"
        status_check: "status-server"
        servers:
          - "secondary-aaa"
    transport_policy:
      enabled: true
      mode: "monitor" # monitor during migration; use enforce for production sign-off.
      fail_closed: true
      default_required_transport: "any" # any, radsec, or udp.
      allow_mixed_transports: false
      route_policies:
        - route: "corp"
          required_transport: "any"
          allow_mixed_transports: false
          description: "Corporate routes must not silently mix RadSec and UDP."
        - route: "guest"
          required_transport: "udp"
          allow_mixed_transports: false
          description: "Guest route explicitly uses UDP until RadSec is certified."
    proxy_policy:
      enabled: true
      fail_closed: true
      default_action: "drop"
      loop_marker: "aegisnas"
      add_loop_marker: true
      reject_loop_marker: true
      max_hops: 8
      route_policies:
        - route: "corp"
          direction: "any"
          trusted_source_realms:
            - "corp.example.com"
            - "employees.example.com"
          allow_standard:
            - "User-Name"
            - "EAP-Message"
            - "Message-Authenticator"
          allow_vendor_ids:
            - 9
            - 14823
          deny_standard:
            - "Filter-Id"
          rewrite_rules:
            - attribute: "User-Name"
              action: "replace_realm"
              match_realm: "employees.example.com"
              replacement: "corp.example.com"
        - route: "guest"
          direction: "proxy_request"
          trusted_source_realms:
            - "guest.example.com"
          allow_vendor_attributes:
            - vendor_id: 14179
              type: 13
              name: "WISPr-Bandwidth-Max-Down"
          deny_vendor_ids:
            - 311

