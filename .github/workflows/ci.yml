name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/admin-ui/package-lock.json
      - run: npm ci
        working-directory: web/admin-ui
      - run: go build ./...
      - run: go test -count=1 -p=1 -v ./...
      - run: make test-vendor-identity
      - run: make test-attribute-registry
      - run: make test-dictionary-release-profiles
      - run: make test-vendor-certification
      - run: make test-broadband-commercial-catalog
      - run: make test-broadband-quota-balance
      - run: make test-broadband-address-leases
      - run: make test-broadband-qos-service-flows
      - run: make test-broadband-l2tp-wholesale
      - run: make test-broadband-dhcp-security
      - run: make test-broadband-service-activation
      - run: make test-broadband-governance-self-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: cd web/admin-ui && npm ci && npm run build
      - run: cd web/admin-ui && npx playwright install --with-deps chromium
      - run: cd web/admin-ui && npx playwright test tests/e2e/attribute-registry.spec.ts
      - run: cd web/admin-ui && npx playwright test tests/e2e/access-settings.spec.ts
