name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/admin-ui/package-lock.json
      - run: npm ci
        working-directory: web/admin-ui
      - run: go build ./...
      - run: go test -count=1 -p=1 -v ./...
      - run: make test-vendor-identity
      - run: make test-attribute-registry
      - run: make test-dictionary-release-profiles
      - run: make test-compatibility-evidence
      - run: make test-vendor-mapping-certification
      - run: make test-cisco-family-pack
      - run: make test-aruba-family-pack
      - run: make test-juniper-extreme-pack
      - run: make test-ruckus-icx-pack
      - run: make test-fortinet-paloalto-pack
      - run: make test-cloud-controller-pack
      - run: make test-access-vendor-pack
      - run: make test-broadband-vendor-pack
      - run: make test-nokia-alu-pack
      - run: make test-mikrotik-pack
      - run: make test-switching-vendor-pack
      - run: make test-long-tail-namespace
      - run: make test-external-vendor-intake
      - run: make test-hostapd-vlan-lifecycle
      - run: make test-wireless-roaming-lifecycle
      - run: make test-passpoint-lifecycle
      - run: make test-ppsk-lifecycle
      - run: make test-controller-estate-lifecycle
      - run: make test-rf-planning-lifecycle
      - run: make test-wireless-security-lifecycle
      - run: make test-cwa-portal-lifecycle
      - run: make test-pppoe-access-lifecycle
      - run: make test-broadband-subscriber-state
      - run: make test-vsa-codec
      - run: make test-opaque-passthrough
      - run: make test-secret-providers
      - run: make test-postgres-data-plane
      - run: make test-radius-packet-hardening
      - run: make test-radius-proxy-routing
      - run: make test-radius-transport-policy
      - run: make test-radius-proxy-policy
      - run: make test-radius-accounting-spool
      - run: make test-radius-accounting-ingest-spool
      - run: make test-radius-sql-accounting
      - run: make test-radius-accounting-ordering
      - run: make test-radius-accounting-counters
      - run: make test-radius-accounting-ip
      - run: make test-radius-accounting-services
      - run: make test-radius-accounting-charging
      - run: make test-radius-outbound-dac-client
      - run: make test-radius-fallback-policy
      - run: make test-atomic-enforcement-transactions
      - run: make test-subscriber-route-export
      - run: make test-active-directory
      - run: make test-identity-failover
      - run: make test-mfa
      - run: make test-admin-webauthn
      - run: make test-eap-framework
      - run: make test-eap-teap
      - run: make test-eap-machine-user
      - run: make test-eap-fast-pwd
      - run: make test-eap-sim-aka
      - run: make test-certificate-lifecycle
      - run: make test-supplicant-lifecycle
      - run: make test-typed-policy-engine
      - run: make test-policy-set-governance
      - run: make test-policy-simulation-analysis
      - run: make test-subscriber-service-chains
      - run: make test-tacacs
      - run: make test-tenant-isolation
      - run: make test-mab
      - run: make test-dynamic-nas-clients
      - run: make test-radsec-credentials
      - run: make test-vendor-certification

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: cd web/admin-ui && npm ci && npm run build
      - run: cd web/admin-ui && npx playwright install --with-deps chromium
      - run: cd web/admin-ui && npx playwright test tests/e2e/attribute-registry.spec.ts
      - run: cd web/admin-ui && npx playwright test tests/e2e/access-settings.spec.ts
