name: aegis-ai-lite
version: '1.0'
summary: AegisNAS AI Lite – advisory recommendations
description: |
  Provides anomaly detection, config linting, and recommendations.

base: core24
confinement: strict
grade: stable

apps:
  aegis-ai-lite:
    command: bin/aegis-ai-lite
    daemon: simple
    plugs:
      - network
      - network-bind
      - system-files
    environment:
      CONFIG_PATH: /var/snap/aegis-ai-lite/common/config.yaml
      DATABASE_PATH: /var/lib/aegisnas/data.db

parts:
  aegis-ai-lite:
    plugin: nil
    source: ../../
    source-type: local
    build-snaps:
      - go/1.26/stable
    override-build: |
      cd "$CRAFT_PART_SRC"
      bash scripts/build-snap-service.sh aegis-ai-lite "$CRAFT_PART_INSTALL"
    stage:
      - bin/aegis-ai-lite