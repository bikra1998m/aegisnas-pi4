<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Branding}} - Voucher</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>{{.Branding}}</h1>
            <p class="subtitle">Enter your voucher code</p>
            {{if .Error}}
            <div class="error">{{.Error}}</div>
            {{end}}
            <form method="POST" action="/voucher">
                <input type="hidden" name="client_mac" value="{{.ClientMAC}}">
                <div class="form-group">
                    <label for="voucher_code">Voucher Code</label>
                    <input type="text" id="voucher_code" name="voucher_code" required autofocus>
                </div>
                <button type="submit" class="btn primary">Connect</button>
            </form>
            <div class="links">
                <a href="/?client_mac={{.ClientMAC}}">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
